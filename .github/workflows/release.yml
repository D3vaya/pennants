name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Needs a maintainer's approval (Settings → Environments → npm), and npm's
    # trusted publisher only accepts tokens from this environment.
    environment:
      name: npm
      url: https://www.npmjs.com/package/pennants/v/${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      # npm 11.5.1+ is required for trusted publishing (OIDC): npm exchanges
      # the job's id-token for a short-lived publish token, so no secret is stored.
      - run: npm install --global npm@11.21.1

      - run: npm ci

      - run: npm run verify

      # verify already ran; --ignore-scripts skips the duplicate prepublishOnly run.
      # Prereleases (v1.2.3-beta.1) go to the "next" dist-tag.
      - name: Publish
        run: |
          tag=latest
          case "${GITHUB_REF_NAME}" in *-*) tag=next ;; esac
          npm publish --provenance --access public --ignore-scripts --tag "$tag"

      # Assets left out of the npm package to keep installs small (PNGs of every
      # shape, every sprite), attached to the GitHub release instead.
      - name: Zip release assets
        run: zip -qr "pennants-assets-${GITHUB_REF_NAME}.zip" svg png sprite LICENSE NOTICE

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: pennants-assets-*.zip
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets

      - name: Create release
        run: |
          flags=""
          case "${GITHUB_REF_NAME}" in *-*) flags="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            $flags \
            pennants-assets-*.zip
        env:
          GH_TOKEN: ${{ github.token }}

  # A new user's first five minutes: install the published version from npm and
  # run every README snippet in Node, tsc and Chromium (e2e/readme).
  readme-e2e:
    name: README works from npm
    needs: [publish, github-release] # the e2e also checks the release zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: e2e/readme
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # The registry can take a minute to serve a new version everywhere.
      - name: Wait for the version on npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 30); do
            npm view "pennants@${version}" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "::error::pennants@${version} is not on npm after 5 minutes"
          exit 1

      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund --save-exact "pennants@${GITHUB_REF_NAME#v}"
      - run: npx playwright install --with-deps chromium
      - run: npm test
