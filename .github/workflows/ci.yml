name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The generator (scripts/generate.ts) relies on Node's built-in type
        # stripping, unflagged since Node 22.18. Node 20 is covered by the
        # smoke job below, which tests the packed tarball instead.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run verify

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Pack tarball
        if: matrix.node == '22'
        run: npm pack

      - name: Upload tarball
        if: matrix.node == '22'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarball
          path: pennants-*.tgz
          if-no-files-found: error
          retention-days: 7

  react18:
    name: Tests with React 18
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Swap in React 18
        run: npm install --no-save --no-audit --no-fund react@18 react-dom@18

      - run: npx vitest run

  bundle-budget:
    name: Bundle budget (Vite probes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Packs the library, builds Vite probes against the tarball and fails when
      # a probe exceeds scripts/bundle-budget.json. The table goes to the run summary.
      - name: Measure and check budgets
        run: npm run bundle:budget >> "$GITHUB_STEP_SUMMARY"

  examples:
    name: Framework examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run examples:check

  smoke-node20:
    name: Smoke test packed package (Node 20.19)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.19'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tarball
          path: ${{ runner.temp }}/pkg

      - name: Install tarball into an empty project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir smoke
          cd smoke
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../pkg/pennants-*.tgz react react-dom

      - name: Import entry points and SSR-render React components
        working-directory: ${{ runner.temp }}/smoke
        run: |
          cat > smoke.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { existsSync } from 'node:fs';
          import { fileURLToPath } from 'node:url';
          import { codes, isPennantCode, loadPennant, getPennantName, pennantUrl } from 'pennants';
          import ar from 'pennants/flags/ar';
          import { definePennantElement } from 'pennants/element';
          import { Pennant, PennantSvg } from 'pennants/react';
          import { createElement as h } from 'react';
          import { renderToString } from 'react-dom/server';

          assert.ok(codes.length > 249, 'codes list');
          assert.ok(isPennantCode('ar'));
          assert.match(ar, /^<svg/);
          assert.equal(await loadPennant('ar'), ar);
          assert.equal(getPennantName('ar'), 'Argentina');
          assert.match(pennantUrl('ar'), /\/svg\/ar\.svg$/);
          for (const specifier of ['pennants/svg/ar.svg', 'pennants/sprite', 'pennants/css']) {
            assert.ok(existsSync(fileURLToPath(import.meta.resolve(specifier))), specifier);
          }

          // No customElements in Node: registering is a no-op.
          assert.equal(definePennantElement(), undefined);

          const inline = renderToString(h(Pennant, { code: 'ar' }));
          assert.match(inline, /data-pennant="ar"/);
          assert.match(inline, /aria-label="Argentina"/);
          assert.match(renderToString(h(Pennant, { code: 'ar', mode: 'img' })), /<img [^>]*src="[^"]*\/svg\/ar\.svg"/);
          const bundled = renderToString(h(PennantSvg, { svg: ar }));
          assert.match(bundled, /<svg/);
          assert.match(bundled, /aria-label="Argentina"/);

          console.log(`OK on Node ${process.version}`);
          JS
          node smoke.mjs
